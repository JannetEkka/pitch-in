openapi: 3.0.3
info:
  title: Pitch In API
  version: 0.1.0
  description: Neighbourhood bounties paid through PayPal only when the fix is verified, and again when it lasts. Pledges are PayPal authorizations
    (held, not charged). The doer is paid with PayPal Payouts. Sign in by sending a sample neighbour id in the X-Pitch-In-User header (demo only;
    production would use Log in with PayPal).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Pitch In
    url: https://github.com/JannetEkka/pitch-in
servers:
- url: https://pitch-in.onrender.com/api
  description: Hosted demo (sandbox)
- url: http://localhost:8080/api
  description: Local
components:
  securitySchemes:
    demoUser:
      type: apiKey
      in: header
      name: X-Pitch-In-User
      description: 'Demo sign-in: the id of a sample neighbour (u_asha, u_ben, u_chen, u_dev, u_esi). Production would use Log in with PayPal.'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: What went wrong
        reasons:
          type: array
          items:
            type: string
            description: Entry
          description: Each rule that refused the request
      description: Error returned when a request is refused or invalid
    ChecklistItem:
      type: object
      required:
      - id
      - text
      properties:
        id:
          type: string
          description: Unique id
          example: b_canal
        text:
          type: string
          description: What the after photo must show
          example: The drain outside the school gate is blocked with leaves.
      description: One thing the after photo must show
    Bounty:
      type: object
      properties:
        id:
          type: string
          description: Unique id
          example: b_canal
        title:
          type: string
          description: Short title of the job
          example: Clear litter along the canal footpath
        report_text:
          type: string
          description: The reporter's own words
        area:
          type: string
          description: Neighbourhood name
          example: Lakeview Lane
        lat:
          type: number
          description: Latitude of the spot
          example: 12.9719
        lng:
          type: number
          description: Longitude of the spot
          example: 77.6412
        job_type:
          type: string
          enum:
          - litter
          - drain
          - paint
          - repair
          - greenery
          - other
          description: Kind of job
        skill:
          type: string
          enum:
          - basic
          - semi
          - skilled
          description: Skill the job needs
        est_hours:
          type: number
          description: Estimated hours for one person
        materials_cents:
          type: integer
          description: Materials, in US cents
        hazard:
          type: string
          nullable: true
          description: Why the job is unsafe for a neighbour, if it is
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
          description: What the after photo must show
        price_low_cents:
          type: integer
          description: Bottom of the fair price range, in cents
        price_high_cents:
          type: integer
          description: Top of the fair price range, in cents
        goal_cents:
          type: integer
          description: Funding goal, in cents
          example: 2300
        holdback_pct:
          type: integer
          description: Share of the payment held until the recheck
        status:
          type: string
          enum:
          - draft
          - funding
          - funded
          - claimed
          - checking
          - objection_window
          - needs_neighbour
          - vote
          - paid
          - recheck_vote
          - closed
          - expired
          - referred
          description: Where the bounty or pledge is in its lifecycle
        reporter_id:
          type: string
          description: Neighbour who reported the problem
        doer_id:
          type: string
          nullable: true
          description: Neighbour who claimed the job
        deadline:
          type: string
          format: date-time
          description: When unfinished holds are voided
        recheck_due_at:
          type: string
          format: date-time
          nullable: true
          description: When the "still fixed" recheck opens
      description: A local job neighbours pay for
    Pledge:
      type: object
      properties:
        id:
          type: string
          description: Unique id
          example: b_canal
        bounty_id:
          type: string
          description: Bounty this belongs to
        funder_id:
          type: string
          description: Neighbour who pledged
        amount_cents:
          type: integer
          description: Amount in US cents
          example: 1500
        order_id:
          type: string
          description: PayPal order id (intent AUTHORIZE)
        authorization_id:
          type: string
          nullable: true
          description: PayPal authorization id
        auth_expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the PayPal hold expires
        status:
          type: string
          enum:
          - created
          - authorized
          - captured
          - voided
          - refunded
          - expired
          description: Where the bounty or pledge is in its lifecycle
        captured_cents:
          type: integer
          description: Amount PayPal captured, in cents
        capture_id:
          type: string
          nullable: true
          description: PayPal capture id
      description: A funder's PayPal hold toward a bounty
    Photo:
      type: object
      required:
      - image
      - lat
      - lng
      - accuracy
      - live_capture
      properties:
        image:
          type: string
          description: data:image/jpeg;base64,...
        lat:
          type: number
          nullable: true
          description: Latitude of the spot
          example: 12.9719
        lng:
          type: number
          nullable: true
          description: Longitude of the spot
          example: 77.6412
        accuracy:
          type: number
          nullable: true
          description: Location accuracy in metres
        live_capture:
          type: boolean
          description: Taken with the in-app camera
      description: A photo with the place and time it was taken
    LedgerEntry:
      type: object
      properties:
        seq:
          type: integer
          description: Position in the receipt chain
        at:
          type: string
          format: date-time
          description: When it happened
        bounty_id:
          type: string
          nullable: true
          description: Bounty this belongs to
        event:
          type: string
          description: What happened
        data:
          type: object
          additionalProperties: true
          description: Details of the event
        prev_hash:
          type: string
          description: Hash of the previous receipt
        hash:
          type: string
          description: SHA-256 over this receipt and the previous hash
      description: One receipt in the hash-chained log
  responses:
    Refused:
      description: Refused by a rule; reasons say which
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
- demoUser: []
paths:
  /session:
    post:
      summary: Sign in as a demo neighbour
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_id
              properties:
                user_id:
                  type: string
                  description: Id of a sample neighbour
                  example: u_ben
              description: Request body
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Signed in
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
      operationId: signIn
      tags:
      - Session
      description: Sign in as a demo neighbour
  /bounties:
    get:
      summary: List bounties with money totals
      security: []
      responses:
        '200':
          description: Bounties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bounty'
                description: Bounties
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: listBounties
      tags:
      - Bounties
      description: List bounties with money totals
  /bounties/{id}:
    get:
      summary: A bounty with its pledges, payouts, photos, AI checks and receipts
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Bounty id
        description: Bounty id
        example: b_canal
      responses:
        '200':
          description: Bounty detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Bounty detail
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getBounty
      tags:
      - Bounties
      description: A bounty with its pledges, payouts, photos, AI checks and receipts
  /reports:
    post:
      summary: Report a problem; the AI writes the bounty (checklist, estimate, hazard) and the rules price it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              - area
              - lat
              - lng
              properties:
                text:
                  type: string
                  description: Plain-language text
                  example: The drain outside the school gate is blocked with leaves.
                area:
                  type: string
                  description: Neighbourhood name
                  example: Lakeview Lane
                lat:
                  type: number
                  description: Latitude of the spot
                  example: 12.9719
                lng:
                  type: number
                  description: Longitude of the spot
                  example: 77.6412
                photo:
                  $ref: '#/components/schemas/Photo'
              description: Request body
      responses:
        '200':
          description: Draft bounty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bounty'
        '409':
          $ref: '#/components/responses/Refused'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: reportProblem
      tags:
      - Bounties
      description: Report a problem; the AI writes the bounty (checklist, estimate, hazard) and the rules price it
  /bounties/{id}/publish:
    post:
      summary: Publish a draft; the goal can't go below the fair-price floor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Bounty id
        description: Bounty id
        example: b_canal
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                goal_cents:
                  type: integer
                  description: Funding goal, in cents
                  example: 2300
              description: Request body
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Published
        '409':
          $ref: '#/components/responses/Refused'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: publishBounty
      tags:
      - Bounties
      description: Publish a draft; the goal can't go below the fair-price floor
  /bounties/{id}/pledges:
    post:
      summary: Start a pledge; creates a PayPal order with intent AUTHORIZE for the buyer to approve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Bounty id
        description: Bounty id
        example: b_canal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount_cents
              properties:
                amount_cents:
                  type: integer
                  description: Amount in US cents
                  example: 1500
                renew_of:
                  type: string
                  description: Pledge this one replaces
              description: Request body
      responses:
        '200':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge_id:
                    type: string
                    description: Pitch In pledge id
                  order_id:
                    type: string
                    description: PayPal order id
                description: Order created
        '409':
          $ref: '#/components/responses/Refused'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: startPledge
      tags:
      - Pledges
      description: Start a pledge; creates a PayPal order with intent AUTHORIZE for the buyer to approve
  /pledges/{id}/confirm:
    post:
      summary: After PayPal approval, authorize the order (money held, not charged)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Pledge id
        description: Pledge id
        example: pl_123456789abc
      responses:
        '200':
          description: Authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pledge'
        '409':
          $ref: '#/components/responses/Refused'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: confirmPledge
      tags:
      - Pledges
      description: After PayPal approval, authorize the order (money held, not charged)
  /bounties/{id}/claim:
    post:
      summary: Claim a funded bounty (not the reporter or a funder; holds must have 10+ days left)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Bounty id
        description: Bounty id
        example: b_canal
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Claimed
        '409':
          $ref: '#/components/responses/Refused'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: claimBounty
      tags:
      - Bounties
      description: Claim a funded bounty (not the reporter or a funder; holds must have 10+ days left)
  /bounties/{id}/photos:
    post:
      summary: Doer adds the before or after photo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Bounty id
        description: Bounty id
        example: b_canal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/Photo'
              - type: object
                required:
                - kind
                properties:
                  kind:
                    type: string
                    enum:
                    - before
                    - after
                    description: Kind of case or photo
              description: Request body
      responses:
        '200':
          description: Stored (EXIF stripped)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Stored (EXIF stripped)
        '409':
          $ref: '#/components/responses/Refused'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: addPhoto
      tags:
      - Proof
      description: Doer adds the before or after photo
  /bounties/{id}/proof:
    post:
      summary: Submit proof; AI check plus fraud checks, then the rules capture pledges and pay out, open an objection window, ask a ne
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Bounty id
        description: Bounty id
        example: b_canal
      responses:
        '200':
          description: Decision applied
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Decision applied
        '409':
          $ref: '#/components/responses/Refused'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: submitProof
      tags:
      - Proof
      description: Submit proof; AI check plus fraud checks, then the rules capture pledges and pay out, open an objection window, ask a neighbour,
        or send it to the funders' vote
  /bounties/{id}/object:
    post:
      summary: A funder objects during the 24-hour window
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Bounty id
        description: Bounty id
        example: b_canal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  description: Why
              description: Request body
      responses:
        '200':
          description: Sent to vote
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Sent to vote
        '409':
          $ref: '#/components/responses/Refused'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: objectToRelease
      tags:
      - Proof
      description: A funder objects during the 24-hour window
  /bounties/{id}/vote:
    post:
      summary: Funder votes; weighted by amount pledged, a tie pays the doer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Bounty id
        description: Bounty id
        example: b_canal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - choice
              properties:
                choice:
                  type: string
                  enum:
                  - pay
                  - refund
                  description: pay or refund
                  example: pay
              description: Request body
      responses:
        '200':
          description: Vote recorded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Vote recorded
        '409':
          $ref: '#/components/responses/Refused'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: vote
      tags:
      - Proof
      description: Funder votes; weighted by amount pledged, a tie pays the doer
  /bounties/{id}/confirm:
    post:
      summary: A neighbour confirms a large bounty on the spot
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Bounty id
        description: Bounty id
        example: b_canal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Confirmed
        '409':
          $ref: '#/components/responses/Refused'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: neighbourConfirm
      tags:
      - Proof
      description: A neighbour confirms a large bounty on the spot
  /bounties/{id}/recheck:
    post:
      summary: The still-fixed recheck; pays the held-back share if the fix held
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Bounty id
        description: Bounty id
        example: b_canal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        '200':
          description: Recheck applied
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Recheck applied
        '409':
          $ref: '#/components/responses/Refused'
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: submitRecheck
      tags:
      - Proof
      description: The "still fixed?" recheck; pays the held-back share if the fix held
  /ledger:
    get:
      summary: Every receipt, hash-chained
      security: []
      responses:
        '200':
          description: Receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerEntry'
                description: Receipts
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: listReceipts
      tags:
      - Receipts
      description: Every receipt, hash-chained
  /ledger/verify:
    get:
      summary: Re-check the whole hash chain
      security: []
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: True if the chain is intact
                  count:
                    type: integer
                    description: Receipts checked
                  broken_at:
                    type: integer
                    nullable: true
                    description: First receipt that fails, if any
                  head:
                    type: string
                    description: Hash of the latest receipt
                description: Result
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: verifyReceipts
      tags:
      - Receipts
      description: Re-check the whole hash chain
  /cases:
    get:
      summary: Support cases
      security: []
      responses:
        '200':
          description: Cases
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Cases
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: listCases
      tags:
      - Support
      description: Support cases
    post:
      summary: Open a support case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - body
              properties:
                bounty_id:
                  type: string
                  nullable: true
                  description: Bounty this belongs to
                kind:
                  type: string
                  description: Kind of case or photo
                body:
                  type: string
                  description: What happened, in your words
              description: Request body
      responses:
        '200':
          description: Opened
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Opened
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
      operationId: openCase
      tags:
      - Support
      description: Open a support case
  /cases/{id}/investigate:
    post:
      summary: AI investigates with the PayPal Agent Toolkit (read-only) and proposes a next step
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Case id
        description: Case id
        example: case_123456789abc
      responses:
        '200':
          description: Finding
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Finding
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
      operationId: investigateCase
      tags:
      - Support
      description: AI investigates with the PayPal Agent Toolkit (read-only) and proposes a next step
  /reconcile:
    post:
      summary: Compare our records with PayPal's; open a case per mismatch
      responses:
        '200':
          description: Mismatches
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Mismatches
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Refused'
      operationId: reconcileWithPayPal
      tags:
      - Support
      description: Compare our records with PayPal's; open a case per mismatch
  /health/areas:
    get:
      summary: Area health (measured, plus labelled sample trends)
      security: []
      responses:
        '200':
          description: Areas
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Areas
        '400':
          $ref: '#/components/responses/BadRequest'
      operationId: getAreaHealth
      tags:
      - Bounties
      description: Area health (measured, plus labelled sample trends)
tags:
- name: Bounties
  description: Report, publish, list and claim bounties
- name: Pledges
  description: PayPal holds toward a bounty
- name: Proof
  description: Photos, AI checks, votes and the recheck
- name: Receipts
  description: The hash-chained receipt log
- name: Support
  description: Support cases and reconciliation with PayPal
- name: Session
  description: Demo sign-in
